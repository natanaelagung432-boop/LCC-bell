<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LCC Bell — Peserta</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0b1424;color:#f8fafc;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center}
.wrap{width:min(600px,94%);text-align:center}
.brand{font-size:34px;font-weight:900}.sub{color:#94a3b8;margin:5px 0 24px}
.card{background:#111d31;border-radius:24px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.number{font-size:56px;font-weight:900;margin:8px 0}
.status{font-size:22px;font-weight:900;padding:18px;border-radius:16px;background:#334155;margin:18px 0}
.status.armed{background:#14532d}.status.locked{background:#7f1d1d}
#buzz{width:100%;height:180px;border-radius:28px;border:0;background:#16a34a;color:white;font-size:42px;font-weight:1000;cursor:pointer;box-shadow:0 10px 0 #166534}
#buzz:active{transform:translateY(6px);box-shadow:0 4px 0 #166534}
#buzz:disabled{background:#475569;box-shadow:none;cursor:not-allowed;transform:none}
.warning{margin-top:18px;padding:15px;border-radius:14px;background:#fff3cd;color:#856404;font-weight:800;line-height:1.5}
.warning.win{background:#dc2626;color:white}
.note{color:#94a3b8;font-size:14px;line-height:1.5;margin-top:18px}
#message{font-size:20px;font-weight:900;min-height:30px;margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">🔔 LCC BELL</div>
  <div class="sub">PESERTA</div>
  <div class="card">
    <div id="identity">Memeriksa QR...</div>
    <div id="statusBox" class="status">MEMERIKSA...</div>
    <button id="buzz" disabled>TEKAN</button>
    <div id="spamWarning" class="warning">
      ⚠️ Tekan hanya satu kali.<br>
      Sistem menerima tekanan pertama.
    </div>
    <div id="message"></div>
    <div class="note">Jangan menekan berulang kali. Setelah ada pemenang, tunggu juri melakukan RESET SOAL.</div>
  </div>
</div>
<audio id="warningSound" src="warning-alarm.mp3" preload="auto"></audio>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const room=window.db.ref("lcc/current");
const params=new URLSearchParams(location.search);
const token=params.get("token");
const buzz=document.getElementById("buzz");
const statusBox=document.getElementById("statusBox");
const identity=document.getElementById("identity");
const warning=document.getElementById("spamWarning");
const message=document.getElementById("message");
let myNumber=null;
let valid=false;
let lastState=null;
const warningSound=document.getElementById("warningSound");
function playWarning(){
  try{ if(!warningSound)return; warningSound.pause(); warningSound.currentTime=0; warningSound.volume=1; const p=warningSound.play(); if(p)p.catch(()=>{}); }catch(e){console.log(e)}
}
async function reportViolation(){
  if(!valid || !token || myNumber===null)return;
  try{ await room.child("violations").push({number:myNumber,token:token,type:"early_or_late_press",time:firebase.database.ServerValue.TIMESTAMP}); }
  catch(e){ console.log("Violation report failed:",e); }
}

function show(msg,type=""){
  message.textContent=msg;
  message.style.color=type==="green"?"#4ade80":type==="red"?"#f87171":"#f8fafc";
}

async function validate(){
  if(!token){
    identity.textContent="❌ QR tidak valid";
    show("Buka halaman melalui QR dari server.","red");
    return;
  }
  try{
    const snap=await room.child("players").child(token).get();
    if(!snap.exists()){
      identity.textContent="❌ QR tidak terdaftar";
      show("Minta juri membuat QR baru.","red");
      return;
    }
    myNumber=snap.val().number;
    valid=true;
    identity.innerHTML="<div class='number'>PESERTA "+myNumber+"</div>";
    listen();
  }catch(e){
    identity.textContent="❌ Gagal terhubung";
    show(e.message,"red");
  }
}

function render(s){
  if(!valid)return;
  s=s||{};
  lastState=s;
  const status=s.status||"waiting";
  statusBox.className="status "+status;
  statusBox.textContent=
    status==="armed"?"🟢 BELL AKTIF — TEKAN SEKALI":
    status==="locked"?"🔴 SOAL TERKUNCI":"⏳ MENUNGGU JURI";
  // Tetap bisa diklik saat menunggu agar pelanggaran dapat dideteksi.
  buzz.disabled=false;

  if(status==="waiting"){
    show("⏳ Menunggu juri menyiapkan bell.");
    warning.className="warning";
    warning.innerHTML="⚠️ BELUM BOLEH MENEKAN!<br>Menekan sekarang akan tercatat sebagai pelanggaran.";
  }

  if(status==="armed"){
    buzz.disabled=false;
    show("Silakan tekan satu kali.");
    warning.className="warning";
    warning.innerHTML="⚠️ Tekan hanya satu kali.<br>Sistem menerima tekanan pertama.";
  }

  if(status==="locked"){
    buzz.disabled=true;
    if(Number(s.winner)===Number(myNumber)){
      show("🏆 ANDA MENANG!","green");
      warning.className="warning win";
      warning.innerHTML="🏆 ANDA SUDAH MENEKAN!<br>⚠️ Jangan tekan lagi.<br>Tunggu juri melakukan RESET SOAL.";
    }else{
      show("Peserta "+s.winner+" menekan lebih dahulu.","red");
      warning.className="warning win";
      warning.innerHTML="🔴 SOAL SUDAH TERKUNCI.<br>Peserta "+s.winner+" menekan lebih dahulu.<br>Tunggu juri melakukan RESET SOAL.";
    }
  }
}

buzz.onclick=async()=>{
  if(!valid || !lastState)return;
  if(lastState.status!=="armed"){
    playWarning();
    show(lastState.status==="waiting" ? "⚠️ PELANGGARAN! Jangan menekan sebelum juri menyiapkan bell." : "⚠️ Soal sudah terkunci. Jangan menekan lagi.","red");
    warning.className="warning win";
    warning.innerHTML=lastState.status==="waiting"
      ? "🚨 PELANGGARAN TERCATAT!<br>Jangan menekan tombol sebelum juri menyiapkan bell."
      : "⚠️ JANGAN SPAM TOMBOL!<br>Soal sudah terkunci. Tunggu RESET SOAL.";
    await reportViolation();
    return;
  }
  buzz.disabled=true;
  show("⏳ Memproses...");
  const clickedRoundId = lastState.roundId || null;
  try{
    const result=await room.transaction(current=>{
      if(!current || current.status!=="armed")return;
      if(!clickedRoundId || current.roundId!==clickedRoundId)return;
      if(current.winner!==null && current.winner!==undefined)return;
      return {
        ...current,
        status:"locked",
        winner:myNumber,
        winnerTime:firebase.database.ServerValue.TIMESTAMP
      };
    });
    if(result.committed){
      show("🏆 ANDA MENANG!","green");
      warning.className="warning win";
      warning.innerHTML="🏆 ANDA SUDAH MENEKAN!<br>⚠️ Jangan tekan lagi.<br>Tunggu juri melakukan RESET SOAL.";
    }else{
      buzz.disabled=false;
      show("Tekanan ditolak: soal terkunci atau ronde sudah berubah.","red");
      warning.className="warning win";
      warning.innerHTML="⚠️ TEKANAN DITOLAK!<br>Ronde sudah berubah atau soal sudah terkunci.";
    }
  }catch(e){
    buzz.disabled=false;
    show("Gagal mengirim: "+e.message,"red");
  }
};

function listen(){
  room.on("value",snap=>render(snap.val()));
}
validate();
</script>
</body>
</html>
