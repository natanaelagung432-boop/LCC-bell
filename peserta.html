<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>LCC Bell — Peserta</title>

<style>
*{
  box-sizing:border-box
}

body{
  margin:0;
  min-height:100vh;
  background:#0b1424;
  color:#f8fafc;
  font-family:Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center
}

.wrap{
  width:min(620px,94%);
  text-align:center
}

.brand{
  font-size:34px;
  font-weight:1000
}

.sub{
  color:#94a3b8;
  margin:5px 0 20px
}

.card{
  background:#111d31;
  border-radius:24px;
  padding:28px
}

.number{
  font-size:56px;
  font-weight:1000
}

.status{
  padding:17px;
  border-radius:16px;
  background:#334155;
  font-size:21px;
  font-weight:1000;
  margin:18px 0
}

.status.armed{
  background:#14532d
}

.status.locked{
  background:#7f1d1d
}

#buzz{
  width:100%;
  height:190px;
  border:0;
  border-radius:28px;
  background:#16a34a;
  color:#fff;
  font-size:44px;
  font-weight:1000;
  cursor:pointer;
  box-shadow:0 10px 0 #166534
}

#buzz:active{
  transform:translateY(6px);
  box-shadow:0 4px 0 #166534
}

#buzz.banned{
  background:#7f1d1d;
  box-shadow:none;
  cursor:not-allowed
}

#message{
  min-height:36px;
  margin-top:17px;
  font-size:20px;
  font-weight:1000
}

.notice{
  margin-top:16px;
  padding:16px;
  border-radius:15px;
  background:#fff3cd;
  color:#856404;
  font-weight:900;
  line-height:1.5
}

.notice.danger{
  background:#7f1d1d;
  color:#fff
}

.timer{
  font-size:72px;
  font-weight:1000;
  margin:10px
}

.winner{
  font-size:28px;
  font-weight:1000
}

.note{
  color:#94a3b8;
  font-size:13px;
  margin-top:17px;
  line-height:1.45
}

@media(max-width:500px){

  .card{
    padding:20px
  }

  .brand{
    font-size:30px
  }

  .number{
    font-size:48px
  }

  .timer{
    font-size:64px
  }

  #buzz{
    height:170px;
    font-size:38px
  }

}
</style>
</head>

<body>

<div class="wrap">

  <div class="brand">
    🔔 LCC BELL
  </div>

  <div class="sub">
    PESERTA
  </div>

  <div class="card">

    <div id="identity">
      Memeriksa QR...
    </div>

    <div id="status" class="status">
      MEMERIKSA...
    </div>

    <div id="timer" class="timer"></div>

    <div id="winner" class="winner"></div>

    <button id="buzz" disabled>
      TEKAN
    </button>

    <div id="notice" class="notice">
      ⏳ Menunggu juri.
    </div>

    <div id="message"></div>

    <div class="note">
      Tekan hanya saat bell sudah disiapkan.
      Spam sebelum aktif atau setelah terkunci akan dihitung sebagai pelanggaran.
    </div>

  </div>

</div>


<!--
  AUDIO PESERTA

  warning-alarm.mp3
  = bunyi saat pelanggaran

  count.mp3
  = TIDAK DIGUNAKAN di peserta

  times-up.mp3
  = bunyi saat waktu habis

  school-bell.mp3
  = TIDAK DIGUNAKAN di peserta
-->

<audio
  id="warningSound"
  src="warning-alarm.mp3"
  preload="auto">
</audio>

<audio
  id="countSound"
  src="count.mp3"
  preload="auto">
</audio>

<audio
  id="timesUpSound"
  src="times-up.mp3"
  preload="auto">
</audio>

<audio
  id="bellSound"
  src="school-bell.mp3"
  preload="auto">
</audio>


<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>

<script>

const room =
  window.db.ref("lcc/current");

const params =
  new URLSearchParams(location.search);

const token =
  params.get("token");

const $ =
  id => document.getElementById(id);


let myNumber = null;
let valid = false;
let last = null;
let lastTimerKey = null;
let timerLoop = null;
let serverOffset = 0;
let violationBusy = false;


/* =========================
   SERVER TIME
========================= */

window.db
  .ref(".info/serverTimeOffset")
  .on("value",s=>{

    serverOffset =
      s.val() || 0;

  });


function now(){

  return Date.now()+
    serverOffset;

}


/* =========================
   AUDIO
========================= */

function play(id){

  try{

    const a =
      $(id);

    a.currentTime = 0;
    a.volume = 1;

    const p =
      a.play();

    if(p){
      p.catch(()=>{});
    }

  }catch(e){}

}


/*
  Membuka izin audio browser.

  HANYA warningSound dan
  timesUpSound yang dipersiapkan.

  countSound dan bellSound
  sengaja TIDAK dimainkan.
*/

function unlock(){

  [
    "warningSound",
    "timesUpSound"
  ].forEach(id=>{

    try{

      const a =
        $(id);

      a.muted = true;

      const p =
        a.play();

      p?.then(()=>{

        a.pause();
        a.currentTime = 0;
        a.muted = false;

      }).catch(()=>{});

    }catch(e){}

  });

}


/* =========================
   NOTICE
========================= */

function notice(t,d=false){

  $("notice").className =
    "notice"+
    (d ? " danger" : "");

  $("notice").innerHTML = t;

}


/* =========================
   RENDER ROOM
========================= */

function render(s){

  if(!valid)return;

  last =
    s || {};

  const st =
    last.status || "waiting";


  $("status").className =
    "status "+st;


  if(st==="armed"){

    $("status").textContent =
      "🟢 BELL AKTIF";

  }else if(st==="locked"){

    $("status").textContent =
      "🔴 SOAL TERKUNCI";

  }else{

    $("status").textContent =
      "⏳ MENUNGGU JURI";

  }


  const p =
    last.players?.[token] || {};


  const banned =
    !!p.banned;


  $("buzz").className =
    banned
      ? "banned"
      : "";


  /* =========================
     BANNED
  ========================= */

  if(banned){

    $("buzz").disabled = true;

    $("buzz").textContent =
      "🚫 BANNED";

    notice(
      "🚫 ANDA DIBLOKIR UNTUK SOAL INI.<br>"+
      "3× pelanggaran. Tunggu juri melakukan RESET SOAL.",
      true
    );

  }


  /* =========================
     BELL AKTIF
  ========================= */

  else if(st==="armed"){

    $("buzz").disabled = false;

    $("buzz").textContent =
      "TEKAN";

    notice(
      "🟢 BELL AKTIF.<br>"+
      "Tekan satu kali."
    );

  }


  /* =========================
     SOAL TERKUNCI
  ========================= */

  else if(st==="locked"){

    $("buzz").disabled = false;

    $("buzz").textContent =
      "TEKAN";


    if(
      Number(last.winner) ===
      Number(myNumber)
    ){

      notice(
        "🏆 ANDA MENANG! Jangan tekan lagi."
      );

    }else{

      notice(
        "🔴 SOAL TERKUNCI. Peserta "+
        last.winner+
        " menekan lebih dahulu."
      );

    }

  }


  /* =========================
     MENUNGGU
  ========================= */

  else{

    $("buzz").disabled = false;

    $("buzz").textContent =
      "TEKAN";

    notice(
      "⏳ BELUM AKTIF.<br>"+
      "Menekan sekarang akan dihitung sebagai pelanggaran.",
      true
    );

  }


  /* =========================
     WINNER
  ========================= */

  $("winner").textContent =
    last.winner
      ? "🏆 PESERTA "+
        last.winner+
        " MENANG"
      : "";


  /* =========================
     TIMER KEY
  ========================= */

  const key =
    (last.roundId || "")+
    "|"+
    (last.timerStartAt || "")+
    "|"+
    (last.timerDuration || 0);


  if(key !== lastTimerKey){

    lastTimerKey =
      key;

    startTimer(last);

  }

}


/* ==================================================
   TIMER PESERTA
==================================================

   PEMENANG
       ↓
   JEDA 5 DETIK
       ↓
   5
       ↓
   4
       ↓
   3
       ↓
   2
       ↓
   1
       ↓
   0
       ↓
   TIMES-UP SOUND

   TIDAK ADA COUNT SOUND
================================================== */

function startTimer(s){

  clearInterval(timerLoop);

  $("timer").textContent = "";


  if(
    !s.timerStartAt ||
    !s.timerDuration ||
    !s.winner
  ){

    return;

  }


  /*
    Jeda 5 detik
  */

  const DELAY =
    5000;


  const start =
    Number(s.timerStartAt)+
    DELAY;


  const duration =
    Number(s.timerDuration);


  const end =
    start+
    (duration*1000);


  let prev = -1;


  function tick(){

    const current =
      now();


    /* =========================
       JEDA 5 DETIK
    ========================= */

    if(current < start){

      $("timer").textContent =
        "⏳";

      return;

    }


    /* =========================
       COUNTDOWN
    ========================= */

    const left =
      Math.ceil(
        (end-current)/1000
      );


    if(left > 0){

      /*
        HANYA ANGKA.

        TIDAK ADA:
        play("countSound")
      */

      $("timer").textContent =
        left;


      prev = left;

    }


    /* =========================
       TIME'S UP
    ========================= */

    else{

      $("timer").textContent =
        "0";


      if(prev !== 0){

        prev = 0;

        /*
          SATU-SATUNYA SUARA
          TIMER DI PESERTA
        */

        play(
          "timesUpSound"
        );

      }


      clearInterval(timerLoop);

    }

  }


  tick();


  timerLoop =
    setInterval(
      tick,
      100
    );

}


/* =========================
   PELANGGARAN
========================= */

async function violation(
  expectedStatus
){

  if(violationBusy)return;

  violationBusy = true;

  unlock();

  play("warningSound");


  try{

    const result =
      await room.transaction(
        current=>{

          if(
            !current?.players?.[token]
          ){

            return;

          }


          const p =
            current.players[token];


          if(p.banned){

            return;

          }


          /*
            Kalau bell sedang aktif
            dan belum ada pemenang,
            maka bukan pelanggaran.
          */

          if(
            current.status==="armed" &&
            current.winner==null
          ){

            return;

          }


          const count =
            (Number(
              p.violationCount
            ) || 0) + 1;


          const banned =
            count >= 3;


          return {

            ...current,

            players:{

              ...current.players,

              [token]:{

                ...p,

                violationCount:
                  count,

                banned:
                  banned

              }

            }

          };

        }
      );


    if(result.committed){

      const p =
        result
          .snapshot
          .val()
          .players[token];


      const count =
        p.violationCount;


      const banned =
        !!p.banned;


      /*
        Simpan histori pelanggaran
      */

      await room
        .child("violations")
        .push({

          number:
            myNumber,

          token:
            token,

          type:
            expectedStatus==="waiting"
              ? "EARLY_PRESS"
              : "LOCKED_PRESS",

          count:
            count,

          banned:
            banned,

          roundId:
            result
              .snapshot
              .val()
              .roundId || null,

          time:
            firebase
              .database
              .ServerValue
              .TIMESTAMP

        });


      /* =========================
         BANNED
      ========================= */

      if(banned){

        /*
          Saat banned:
          times-up berbunyi.
        */

        play(
          "timesUpSound"
        );


        notice(
          "🚫 BANNED!<br>"+
          "3× pelanggaran pada soal ini. "+
          "Tunggu RESET SOAL.",
          true
        );


        $("buzz").disabled =
          true;

      }


      /* =========================
         PELANGGARAN BIASA
      ========================= */

      else{

        notice(
          "⚠️ PELANGGARAN #"+
          count+
          " tercatat.<br>"+
          "Jangan menekan lagi.",
          true
        );

      }

    }

  }catch(e){

    $("message").textContent =
      "Gagal mencatat pelanggaran: "+
      e.message;

  }


  violationBusy = false;

}


/* =========================
   TOMBOL TEKAN
========================= */

$("buzz").onclick =
  async()=>{

    if(
      !valid ||
      !last
    ){

      return;

    }


    /*
      Persiapkan audio warning/
      times-up setelah interaksi
      pengguna.
    */

    unlock();


    const st =
      last.status ||
      "waiting";


    const p =
      last.players?.[token] ||
      {};


    if(p.banned){

      return;

    }


    /*
      Belum aktif atau
      sudah terkunci =
      pelanggaran.
    */

    if(
      st !== "armed" ||
      last.winner != null
    ){

      await violation(st);

      return;

    }


    const clickedRound =
      last.roundId;


    $("buzz").disabled =
      true;


    $("message").textContent =
      "⏳ Memproses...";


    try{

      const r =
        await room.transaction(
          current=>{

            if(
              !current?.players?.[token]
            ){

              return;

            }


            if(
              current
                .players[token]
                .banned
            ){

              return;

            }


            /*
              Validasi:
              - harus armed
              - belum ada winner
              - round harus sama
            */

            if(
              current.status !==
                "armed" ||

              current.winner !=
                null ||

              current.roundId !==
                clickedRound
            ){

              return;

            }


            return {

              ...current,

              status:
                "locked",

              winner:
                myNumber,

              winnerTime:
                firebase
                  .database
                  .ServerValue
                  .TIMESTAMP,

              /*
                Timer memakai waktu
                kemenangan.

                startTimer() otomatis
                menambahkan delay 5 detik.
              */

              timerStartAt:
                firebase
                  .database
                  .ServerValue
                  .TIMESTAMP

            };

          }
        );


      /* =========================
         TRANSACTION GAGAL
      ========================= */

      if(!r.committed){

        $("buzz").disabled =
          false;


        const c =
          r.snapshot.val() ||
          {};


        if(
          c.status !== "armed" ||
          c.winner != null
        ){

          await violation(
            c.status || "locked"
          );

        }else{

          $("message").textContent =
            "Ronde berubah. Tekanan ditolak.";

        }

      }


      /* =========================
         BERHASIL MENANG
      ========================= */

      else{

        $("message").textContent =
          "🏆 ANDA MENANG!";

      }


    }catch(e){

      $("buzz").disabled =
        false;


      $("message").textContent =
        "❌ "+e.message;

    }

  };


/* =========================
   VALIDASI QR
========================= */

async function validate(){

  if(!token){

    $("identity").textContent =
      "❌ QR tidak valid";

    return;

  }


  const s =
    await room
      .child("players")
      .child(token)
      .get();


  if(!s.exists()){

    $("identity").textContent =
      "❌ QR tidak terdaftar";

    return;

  }


  myNumber =
    s.val().number;


  valid = true;


  $("identity").innerHTML =
    "<div class='number'>PESERTA "+
    myNumber+
    "</div>";


  /*
    Dengarkan perubahan Firebase
  */

  room.on(
    "value",
    s=>{
      render(
        s.val()
      );
    }
  );

}


validate();

</script>

</body>
</html>
