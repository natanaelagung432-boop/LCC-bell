<!doctype html>
<html lang="id">
<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>LCC Bell — Peserta</title>

<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<script src="firebase-config.js"></script>

</head>


<body>

<div class="app">

  <!-- HEADER -->

  <div class="top">

    <div>

      <h1>🔔 LCC BELL</h1>

      <div class="sub">
        PESERTA
      </div>

    </div>

    <a
      class="back"
      href="index.html"
    >
      ← Menu
    </a>

  </div>


  <!-- ERROR -->

  <section
    id="errorPanel"
    class="panel"
    style="display:none"
  >

    <h2>⚠️ QR Tidak Valid</h2>

    <p id="errorMessage">
      QR peserta tidak ditemukan.
    </p>

  </section>


  <!-- GAME -->

  <section
    id="game"
    class="panel buzz-wrap"
    style="display:none"
  >

    <div
      id="myNumber"
      class="my-number"
    ></div>


    <div
      id="msg"
      class="message"
    >
      Menghubungkan...
    </div>


    <!-- TOMBOL BUZZ -->

    <button
      id="buzz"
      class="buzz"
      disabled
      style="
        width:min(80vw,350px);
        height:min(80vw,350px);
        max-height:350px;
        border-radius:50%;
        font-size:32px;
        font-weight:bold;
        cursor:pointer;
        margin:25px auto;
        display:block;
      "
    >

      🔔
      <br>

      TEKAN

    </button>


    <div
      id="connection"
      class="connection"
    >
      Menghubungkan Firebase...
    </div>

  </section>

</div>


<script>

/* =========================================================
   CEK FIREBASE
========================================================= */

if (!window.db) {

  showError(
    "Firebase belum dikonfigurasi. Periksa firebase-config.js."
  );

  throw new Error(
    "Firebase configuration belum diisi."
  );

}


/* =========================================================
   DATABASE
========================================================= */

const room =
  db.ref("lcc/current");


/* =========================================================
   TOKEN DARI QR
========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const token =
  params.get("token");


/* =========================================================
   ELEMENT
========================================================= */

const game =
  document.getElementById("game");

const errorPanel =
  document.getElementById("errorPanel");

const myNumber =
  document.getElementById("myNumber");

const buzz =
  document.getElementById("buzz");

const connection =
  document.getElementById("connection");


/* =========================================================
   ERROR
========================================================= */

function showError(message) {

  document.getElementById(
    "errorMessage"
  ).textContent = message;

  document.getElementById(
    "errorPanel"
  ).style.display = "block";

}


/* =========================================================
   PESAN
========================================================= */

function msg(
  text,
  type = ""
) {

  const e =
    document.getElementById("msg");

  e.textContent = text;

  e.className =
    "message " + type;

}


/* =========================================================
   CEK TOKEN
========================================================= */

if (!token) {

  showError(
    "Silakan scan QR peserta yang diberikan oleh server/juri."
  );

}


/* =========================================================
   LOAD IDENTITAS PESERTA
========================================================= */

async function loadPlayer() {

  if (!token) return;

  try {

    const snap =
      await room
        .child("players")
        .child(token)
        .once("value");


    const player =
      snap.val();


    if (
      !player ||
      !player.number
    ) {

      showError(
        "QR ini tidak terdaftar atau sudah tidak berlaku."
      );

      return;

    }


    /* -------------------------
       TAMPILKAN GAME
    ------------------------- */

    game.style.display =
      "block";


    myNumber.textContent =
      "PESERTA " +
      player.number;


    /* Simpan nomor secara internal */

    window.myPlayerNumber =
      Number(player.number);


    /* Mulai listener room */

    startRoomListener();


  }

  catch (e) {

    showError(
      "Gagal membaca data peserta: " +
      e.message
    );

  }

}


/* =========================================================
   STATUS GAME
========================================================= */

function render(raw) {

  const s =
    raw || {
      status: "waiting",
      winner: null
    };


  /* -------------------------
     BELL AKTIF
  ------------------------- */

  if (
    s.status === "armed"
  ) {

    buzz.disabled =
      false;

    buzz.style.opacity =
      "1";

    buzz.style.cursor =
      "pointer";

    msg(
      "🟢 BELL AKTIF — TEKAN!",
      "green"
    );

    return;

  }


  /* -------------------------
     TERKUNCI
  ------------------------- */

  if (
    s.status === "locked"
  ) {

    buzz.disabled =
      true;

    buzz.style.opacity =
      ".5";

    buzz.style.cursor =
      "not-allowed";


    if (
      Number(s.winner) ===
      Number(window.myPlayerNumber)
    ) {

      msg(
        "🏆 ANDA MENANG!",
        "green"
      );

    }

    else {

      msg(
        "🔴 TERKUNCI — PESERTA " +
        s.winner +
        " MENEKAN TERLEBIH DAHULU",
        "red"
      );

    }

    return;

  }


  /* -------------------------
     MENUNGGU
  ------------------------- */

  buzz.disabled =
    true;

  buzz.style.opacity =
    ".5";

  buzz.style.cursor =
    "not-allowed";

  msg(
    "MENUNGGU JURI MENYIAPKAN BELL",
    "yellow"
  );

}


/* =========================================================
   LISTENER REALTIME
========================================================= */

function startRoomListener() {

  room.on(

    "value",

    snap => {

      render(
        snap.val()
      );

      connection.textContent =
        "● Firebase terhubung";

    },

    err => {

      connection.textContent =
        "✕ Firebase gagal: " +
        err.message;

    }

  );

}


/* =========================================================
   BUZZ
========================================================= */

buzz.onclick =
  async () => {

    if (
      !window.myPlayerNumber
    ) {
      return;
    }


    /* Cegah double click */

    buzz.disabled =
      true;


    try {

      const result =
        await room.transaction(
          current => {

            /* Tidak ada data */

            if (!current) {
              return;
            }


            /* Bell belum aktif */

            if (
              current.status !==
              "armed"
            ) {

              return;

            }


            /* Sudah ada pemenang */

            if (
              current.winner !==
              null &&
              current.winner !==
              undefined
            ) {

              return;

            }


            /*
             * PESERTA INI MENJADI
             * PEMENANG PERTAMA
             */

            return {

              ...current,

              status: "locked",

              winner:
                window.myPlayerNumber,

              winnerTime:
                firebase.database
                  .ServerValue
                  .TIMESTAMP

            };

          }
        );


      /* -------------------------
         TRANSAKSI BERHASIL
      ------------------------- */

      if (
        result.committed
      ) {

        msg(
          "🏆 ANDA MENANG!",
          "green"
        );

      }

      else {

        /*
         * Orang lain lebih dulu
         */

        render(
          result.snapshot.val()
        );

      }

    }

    catch (e) {

      buzz.disabled =
        false;

      connection.textContent =
        "✕ Gagal menekan bell: " +
        e.message;

    }

  };


/* =========================================================
   MULAI
========================================================= */

loadPlayer();

</script>

</body>
</html>
