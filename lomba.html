<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LCC Bell — Lomba</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08111f;color:#f8fafc;font-family:Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:22px}
header{text-align:center;margin-bottom:18px}.brand{font-size:38px;font-weight:1000}.sub{color:#94a3b8}
.status{border-radius:20px;padding:24px;text-align:center;font-size:27px;font-weight:1000;background:#334155}.status.armed{background:#14532d}.status.locked{background:#7f1d1d}
.controls{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:16px}.mainbtn{min-height:150px;font-size:34px;border:0;border-radius:24px;font-weight:1000;cursor:pointer;background:#16a34a;color:white;box-shadow:0 10px 0 #166534}.reset{font-size:28px;background:#475569;color:#fff;border:0;border-radius:24px;font-weight:1000;cursor:pointer}.mainbtn:active,.reset:active{transform:translateY(3px)}button:disabled{opacity:.45;cursor:not-allowed}
.card{background:#111d31;border-radius:22px;padding:22px;margin-top:16px}.setting{display:flex;gap:10px;flex-wrap:wrap}.timerbtn{padding:13px 18px;border:0;border-radius:12px;background:#334155;color:white;font-weight:900;cursor:pointer}.timerbtn.active{background:#2563eb}
.timer{font-size:72px;font-weight:1000;text-align:center;margin:8px 0}.winner{text-align:center;font-size:32px;font-weight:1000}
.log{max-height:320px;overflow:auto;display:flex;flex-direction:column-reverse;gap:8px}.item{padding:11px 13px;border-radius:11px;background:#1b2a43;font-weight:700}.danger{background:#3b1118}.ok{background:#12351f}.note{color:#94a3b8;font-size:13px;line-height:1.45}
@media(max-width:700px){.controls{grid-template-columns:1fr}.mainbtn{min-height:120px}.brand{font-size:31px}.timer{font-size:58px}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand">🔔 LCC BELL</div><div class="sub">HALAMAN LOMBA / JURI</div></header>
<div id="status" class="status">⏳ MENUNGGU / SIAP RESET</div>
<div class="controls"><button id="arm" class="mainbtn">🔔 SIAPKAN BELL<br><small>ENTER</small></button><button id="reset" class="reset">🔄 RESET SOAL<br><small>R</small></button></div>
<div class="card">
<h2>⏱ TIMER</h2><div class="setting"><button class="timerbtn active" data-sec="0">OFF</button><button class="timerbtn" data-sec="5">5 DETIK</button><button class="timerbtn" data-sec="10">10 DETIK</button></div>
<div id="timer" class="timer">—</div><div id="winner" class="winner"></div>
</div>
<div class="card"><h2>📢 NOTIFIKASI</h2><div id="logs" class="log"></div></div>
<div class="card"><div class="note">ENTER = siapkan bell · R = reset soal. Shortcut aktif saat tidak sedang mengetik pada input/textarea/select.</div></div>
</div>
<audio id="bellSound" src="school-bell.mp3" preload="auto"></audio>
<audio id="warningSound" src="warning-alarm.mp3" preload="auto"></audio>
<audio id="countSound" src="count.mp3" preload="auto"></audio>
<audio id="timesUpSound" src="times-up.mp3" preload="auto"></audio>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const room=window.db.ref("lcc/current"),viol=window.db.ref("lcc/violations"),$=id=>document.getElementById(id);
let lastWinner=null,lastViolation=null,lastTimerKey=null,timerLoop=null,serverOffset=0;
window.db.ref(".info/serverTimeOffset").on("value",s=>serverOffset=s.val()||0);
function now(){return Date.now()+serverOffset}
function round(){return "ROUND-"+Date.now().toString(36).toUpperCase()+"-"+Math.random().toString(36).slice(2,7).toUpperCase()}
function play(id){try{const a=$(id);if(!a)return;a.currentTime=0;a.volume=1;const p=a.play();if(p)p.catch(()=>{})}catch(e){}}
function unlock(){["bellSound","warningSound","countSound","timesUpSound"].forEach(id=>{try{const a=$(id);if(!a)return;a.muted=true;const p=a.play();p?.then(()=>{a.pause();a.currentTime=0;a.muted=false}).catch(()=>{})}catch(e){}})}
function log(t,cls=""){const d=document.createElement("div");d.className="item "+cls;d.textContent=t;$("logs").prepend(d);while($("logs").children.length>80)$("logs").lastChild.remove()}
function render(s){
 s=s||{};const st=s.status||"waiting";$("status").className="status "+st;
 $("status").textContent=st==="armed"?"🟢 BELL AKTIF — TUNGGU TEKANAN":st==="locked"?"🔴 SOAL TERKUNCI":"⏳ MENUNGGU / SIAP RESET";
 const players=s.players||{}; const count=Object.keys(players).length;
 const hasBan=Object.values(players).some(p=>p&&p.banned===true);
 $("arm").disabled=st!=="waiting"||count<2||hasBan;
 $("reset").disabled=count<1;
 $("winner").textContent=s.winner?"🏆 PESERTA "+s.winner+" MENANG":"";
 if(s.winner&&s.winner!==lastWinner){lastWinner=s.winner;play("bellSound");log("🏆 Peserta "+s.winner+" MENANG — school bell berbunyi","ok")}
 if(!s.winner)lastWinner=null;
 const key=(s.roundId||"")+"|"+(s.timerStartAt||"")+"|"+(s.timerDuration||0);
 if(key!==lastTimerKey){lastTimerKey=key;startTimer(s)}
}
function startTimer(s){
 clearInterval(timerLoop);$("timer").textContent="—";
 if(!s.timerStartAt||!s.timerDuration||!s.winner)return;
 const start=Number(s.timerStartAt),duration=Number(s.timerDuration),end=start+duration*1000;let last=-1,finished=false;
 const tick=()=>{const t=now();if(t<start){$("timer").textContent="⏳";return}
  const left=Math.ceil((end-t)/1000);
  if(left>0){$("timer").textContent=left;if(left!==last){last=left;play("countSound")}}
  else{$("timer").textContent="0";if(!finished){finished=true;play("timesUpSound");log("⏱ TIME'S UP","danger")}clearInterval(timerLoop)}
 };
 tick();timerLoop=setInterval(tick,100);
}
document.querySelectorAll(".timerbtn").forEach(b=>b.onclick=async()=>{
 unlock();const sec=Number(b.dataset.sec);
 document.querySelectorAll(".timerbtn").forEach(x=>x.classList.remove("active"));b.classList.add("active");
 try{await room.update({timerDuration:sec});log("⏱ Timer diatur: "+(sec?sec+" detik":"OFF"))}
 catch(e){log("❌ Gagal mengatur timer: "+e.message,"danger")}
});
async function arm(){
 unlock();
 try{
  const s=(await room.get()).val();
  const players=s?.players||{};
  if(!s||s.status!=="waiting")return log("⚠️ RESET SOAL dulu sebelum menyiapkan ronde berikutnya.","danger");
  if(Object.keys(players).length<2)return log("⚠️ Belum ada peserta.","danger");
  if(Object.values(players).some(p=>p&&p.banned===true))return log("⚠️ Ada peserta yang masih BANNED. Tekan RESET SOAL terlebih dahulu.","danger");
  const rid=round();
  await room.update({status:"armed",winner:null,winnerTime:null,roundId:rid,timerStartAt:null});
  log("🟢 BELL AKTIF — ronde "+rid,"ok");
 }catch(e){log("❌ Gagal: "+e.message,"danger")}
}
async function reset(){
 unlock();
 try{
  const snap=await room.get();
  const current=snap.val();
  if(!current)return;
  const updates={
   status:"waiting",
   winner:null,
   winnerTime:null,
   roundId:null,
   timerStartAt:null
  };
  Object.keys(current.players||{}).forEach(token=>{
   updates["players/"+token+"/banned"]=false;
   updates["players/"+token+"/violationCount"]=0;
   updates["players/"+token+"/banRoundId"]=null;
  });
  await room.update(updates);
  clearInterval(timerLoop);timerLoop=null;$("timer").textContent="—";
  lastTimerKey=null;
  log("🔄 SOAL DI-RESET — semua BAN dan hitungan pelanggaran ronde dihapus","ok");
 }catch(e){log("❌ Gagal reset: "+e.message,"danger")}
}
$("arm").onclick=arm;$("reset").onclick=reset;
document.addEventListener("keydown",e=>{
 const tag=document.activeElement?.tagName;if(["INPUT","TEXTAREA","SELECT"].includes(tag))return;
 if(e.key==="Enter"&&!e.repeat){e.preventDefault();arm()}
 if(e.key.toLowerCase()==="r"&&!e.repeat){e.preventDefault();reset()}
});
room.on("value",s=>render(s.val()));
viol.limitToLast(80).on("child_added",s=>{
 const v=s.val();if(!v||s.key===lastViolation)return;lastViolation=s.key;
 const msg="🚨 Peserta "+v.number+" pelanggaran #"+(v.count||"?")+(v.banned?" — BANNED":"");
 log(msg,"danger");
 unlock();play("warningSound");
 if(v.banned)play("timesUpSound");
});
</script>
</body></html>
