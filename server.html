<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LCC Bell — Setup</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1424;color:#f8fafc;font-family:Arial,sans-serif}
.wrap{max-width:1200px;margin:auto;padding:24px}.brand{font-size:34px;font-weight:900}.sub{color:#94a3b8;margin:5px 0 22px}
.card{background:#111d31;border-radius:22px;padding:24px;margin:18px 0}h2{margin-top:0}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}input{width:110px;padding:13px;border-radius:12px;border:2px solid #475569;background:#0b1424;color:white;font-weight:800;text-align:center}
button{border:0;border-radius:14px;padding:15px 22px;font:inherit;font-weight:900;cursor:pointer}.primary{background:#16a34a;color:#fff}.secondary{background:#475569;color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px}
.player{background:#1b2a43;border-radius:18px;padding:16px;text-align:center}.player h3{font-size:25px;margin:0 0 10px}.qr{background:#fff;padding:8px;border-radius:10px;display:inline-block}.url{font-size:11px;color:#94a3b8;word-break:break-all;margin-top:8px}
.note{color:#94a3b8;line-height:1.5}.msg{min-height:25px;font-weight:800;margin-top:12px}
.big{font-size:22px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><div class="brand">🔔 LCC BELL</div><div class="sub">HALAMAN SETUP & REGISTRASI</div></div></div>
<div class="card">
<h2>1. Buat Peserta</h2>
<div class="row"><label>Jumlah peserta</label><input id="count" type="number" min="2" max="50" value="8"><button id="create" class="primary">BUAT QR PESERTA</button></div>
<div id="msg" class="msg"></div>
<p class="note">QR dibuat unik untuk setiap peserta. Setelah semua QR siap, klik SELESAI untuk masuk ke halaman lomba.</p>
</div>
<div class="card"><h2>2. QR Peserta</h2><div id="players" class="grid"></div></div>
<div class="card">
<h2>3. Masuk Halaman Lomba</h2>
<button id="finish" class="primary big" disabled>SELESAI → MASUK LOMBA</button>
<p class="note">Halaman lomba dibuat khusus untuk kontrol cepat: Enter = siapkan bell, R = reset soal.</p>
</div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const room=window.db.ref("lcc/current"); const $=id=>document.getElementById(id);
function token(){if(crypto?.getRandomValues){const a=new Uint8Array(12);crypto.getRandomValues(a);return [...a].map(x=>x.toString(16).padStart(2,"0")).join("").toUpperCase()}return (Date.now().toString(36)+Math.random().toString(36).slice(2)).toUpperCase()}
function url(t){return location.origin+location.pathname.replace(/server\.html.*$/,"peserta.html")+"?token="+encodeURIComponent(t)}
function render(players){
 const box=$("players");box.innerHTML="";const es=Object.entries(players||{}).sort((a,b)=>a[1].number-b[1].number);
 es.forEach(([t,p])=>{const c=document.createElement("div");c.className="player";c.innerHTML=`<h3>PESERTA ${p.number}</h3><div class="qr"></div><div class="url">${url(t)}</div>`;box.appendChild(c);new QRCode(c.querySelector(".qr"),{text:url(t),width:150,height:150,correctLevel:QRCode.CorrectLevel.H})});
 $("finish").disabled=es.length<2;
}
$("create").onclick=async()=>{
 const n=Math.max(2,Math.min(50,Number($("count").value)||8)),players={};
 for(let i=1;i<=n;i++)players[token()]={number:i,violationCount:0,banned:false};
 try{await room.set({status:"waiting",winner:null,winnerTime:null,roundId:null,participantCount:n,players,timerDuration:0,timerStartAt:null});render(players);$("msg").textContent="✅ "+n+" QR peserta dibuat."}catch(e){$("msg").textContent="❌ "+e.message}
};
$("finish").onclick=()=>location.href="lomba.html";
room.on("value",s=>{const v=s.val();if(v?.players)render(v.players)});
</script>
</body></html>
