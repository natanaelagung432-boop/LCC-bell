<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LCC Bell — Server</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1424;color:#f8fafc;font-family:Arial,sans-serif}
a{color:#93c5fd;text-decoration:none}
.wrap{max-width:1400px;margin:auto;padding:22px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand{font-size:34px;font-weight:900}.sub{color:#94a3b8;margin-top:4px}
.card{background:#111d31;border-radius:22px;padding:26px;margin:18px 0}
h2{margin-top:0}
.status{padding:24px;border-radius:20px;text-align:center;font-size:28px;font-weight:900;background:#334155}
.status.armed{background:#14532d}.status.locked{background:#7f1d1d}
.light{width:34px;height:34px;border-radius:50%;display:inline-block;vertical-align:middle;background:#334155;border:3px solid #020617;box-shadow:0 0 10px rgba(255,255,255,.12)}
.light.on{background:#22c55e;box-shadow:0 0 28px #22c55e}
.controls{display:flex;gap:14px;flex-wrap:wrap;margin-top:20px}
button,input{font:inherit}
button{border:0;border-radius:14px;padding:16px 22px;font-weight:900;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:#16a34a;color:white}.secondary{background:#475569;color:white}.danger{background:#dc2626;color:white}
input{width:100px;padding:14px;border-radius:12px;border:2px solid #475569;background:#0b1424;color:white;text-align:center;font-weight:800}
.setting{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.winner{font-size:40px;font-weight:900;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.player{background:#1b2a43;border-radius:18px;padding:18px;text-align:center}
.player h3{font-size:28px;margin:0 0 12px}
.qr{background:white;padding:10px;border-radius:10px;display:inline-block;min-height:170px}
.url{font-size:11px;color:#94a3b8;word-break:break-all;margin-top:10px}
.note{color:#94a3b8;font-size:14px;line-height:1.5}
#message{min-height:24px;margin-top:12px;font-weight:700}
@media(max-width:600px){.brand{font-size:27px}.status{font-size:21px}.winner{font-size:30px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><div class="brand">🔔 LCC BELL</div><div class="sub">SERVER / JURI</div></div>
  <a href="index.html">← Menu</a>
</header>

<div id="statusBox" class="status">
  <span id="light" class="light"></span>
  <span id="statusText">MENUNGGU PESERTA</span>
</div>

<div class="card">
  <h2>Pengaturan Peserta</h2>
  <div class="setting">
    <label>Jumlah peserta:</label>
    <input id="participantCount" type="number" min="2" max="50" value="8">
    <button id="createPlayers" class="primary">BUAT QR PESERTA</button>
  </div>
  <div class="note" style="margin-top:12px">
    Setiap peserta mendapat QR unik. Peserta tidak perlu memilih nomor sendiri.
  </div>
</div>

<div class="card">
  <h2>Kontrol Bell</h2>
  <div class="controls">
    <button id="arm" class="primary">SIAPKAN BELL</button>
    <button id="reset" class="secondary">RESET SOAL</button>
  </div>
  <div id="message"></div>
  <div class="note">Tips: klik tombol sekali sebelum pertandingan agar browser mengizinkan suara bell.</div>
  <div id="winner" class="winner"></div>
</div>

<div class="card">
  <h2>Peserta & QR</h2>
  <div id="players" class="grid"></div>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<audio id="bellSound" src="school-bell.mp3" preload="auto"></audio>
<script>
const room = window.db.ref("lcc/current");
const $ = id => document.getElementById(id);
let audioCtx = null;
let lastWinner = null;

function createToken(){
  if(window.crypto && crypto.getRandomValues){
    const bytes=new Uint8Array(12);
    crypto.getRandomValues(bytes);
    return Array.from(bytes).map(b=>b.toString(16).padStart(2,"0")).join("").toUpperCase();
  }
  return (Date.now().toString(36)+Math.random().toString(36).slice(2)).toUpperCase();
}

function participantUrl(token){
  return window.location.origin +
    window.location.pathname.replace(/server\.html.*$/,"peserta.html") +
    "?token="+encodeURIComponent(token);
}

function unlockAudio(){
  try{
    const bellSound=document.getElementById("bellSound");
    if(!bellSound)return;
    bellSound.muted=true;
    const p=bellSound.play();
    if(p){
      p.then(()=>{
        bellSound.pause();
        bellSound.currentTime=0;
        bellSound.muted=false;
      }).catch(()=>{});
    }
  }catch(e){}
}

function bell(){
  try{
    const bellSound=document.getElementById("bellSound");
    if(!bellSound)return;
    bellSound.currentTime=0;
    bellSound.volume=1;
    const p=bellSound.play();
    if(p)p.catch(e=>console.log(e));
  }catch(e){console.log(e)}
}

function render(s){
  s=s||{status:"waiting",winner:null,participantCount:0,players:{}};
  const status=s.status||"waiting";
  $("statusBox").className="status "+status;
  $("light").className="light "+(status==="locked"?"on":"");
  $("statusText").textContent =
    status==="armed" ? "BELL AKTIF — TUNGGU TEKANAN" :
    status==="locked" ? "BELL TERKUNCI" : "MENUNGGU / SIAP RESET";
  $("winner").textContent =
    s.winner ? "🏆 PESERTA "+s.winner+" MENANG" : "";
  $("arm").disabled=!s.players || Object.keys(s.players).length<2 || status==="armed";
  $("reset").disabled=status==="waiting" && !s.winner;

  if(s.winner && s.winner!==lastWinner){
    lastWinner=s.winner;
    bell();
  }
  if(!s.winner) lastWinner=null;

  renderPlayers(s.players||{});
}

function renderPlayers(players){
  const box=$("players");
  box.innerHTML="";
  const entries=Object.entries(players).sort((a,b)=>(a[1].number||0)-(b[1].number||0));
  if(!entries.length){
    box.innerHTML='<div class="note">Belum ada QR. Tentukan jumlah peserta lalu klik BUAT QR PESERTA.</div>';
    return;
  }
  entries.forEach(([token,p])=>{
    const card=document.createElement("div");
    card.className="player";
    card.innerHTML=`<h3>PESERTA ${p.number}</h3><div class="qr"></div><div class="url">${participantUrl(token)}</div>`;
    box.appendChild(card);
    new QRCode(card.querySelector(".qr"),{
      text:participantUrl(token),width:150,height:150,
      correctLevel:QRCode.CorrectLevel.H
    });
  });
}

$("createPlayers").onclick=async()=>{
  unlockAudio();
  const count=Math.max(2,Math.min(50,Number($("participantCount").value)||8));
  $("participantCount").value=count;
  const players={};
  for(let i=1;i<=count;i++) players[createToken()]={number:i};
  try{
    await room.set({status:"waiting",winner:null,winnerTime:null,participantCount:count,players});
    $("message").textContent="✅ QR "+count+" peserta berhasil dibuat.";
  }catch(e){
    $("message").textContent="❌ Gagal membuat QR: "+e.message;
  }
};

$("arm").onclick=async()=>{
  unlockAudio();
  try{
    const snap=await room.get();
    const s=snap.val();
    if(!s || !s.players || Object.keys(s.players).length<2){
      $("message").textContent="⚠️ Buat QR peserta terlebih dahulu.";
      return;
    }
    await room.update({status:"armed",winner:null,winnerTime:null});
    $("message").textContent="🟢 Bell aktif. Peserta sudah boleh menekan.";
  }catch(e){$("message").textContent="❌ "+e.message}
};

$("reset").onclick=async()=>{
  unlockAudio();
  try{
    await room.update({status:"waiting",winner:null,winnerTime:null});
    $("message").textContent="↩️ Soal di-reset. Bell siap digunakan lagi.";
  }catch(e){$("message").textContent="❌ "+e.message}
};

room.on("value",snap=>render(snap.val()));
room.on("value",()=>{});
</script>
</body>
</html>
